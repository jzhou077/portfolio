<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Zhou</title>
    <meta
      name="description"
      content="Jack Zhou studies electrical engineering and computer science at MIT. Projects, research, and a pure pursuit simulator."
    />
    <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />

    <!-- Social link previews. TODO: add an og:image (1200x630) once you have one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jack Zhou" />
    <meta
      property="og:description"
      content="EECS student at MIT. Projects, research, and a pure pursuit simulator."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved/system theme before first paint to avoid a light-mode flash. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
